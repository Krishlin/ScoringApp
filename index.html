<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E1A12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Cricket Scoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="innings" data-action="switch-team" data-team="home" aria-pressed="true">
        <span class="innings-name" id="homeName">Home</span>
        <span class="innings-score" id="homeScore">0/0</span>
      </button>
      <button class="innings" data-action="switch-team" data-team="away" aria-pressed="false">
        <span class="innings-name" id="awayName">Opponent</span>
        <span class="innings-score" id="awayScore">0/0</span>
      </button>
      <button class="icon-btn" data-action="toggle-setup" id="setupToggle" aria-expanded="false" aria-controls="setupPanel" aria-label="Match setup">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 7h10M17 7h4M3 17h4M11 17h10" />
          <circle cx="15" cy="7" r="2.6" />
          <circle cx="9" cy="17" r="2.6" />
        </svg>
      </button>
    </header>

    <section class="setup" id="setupPanel" hidden>
      <div class="field">
        <label for="homeTeam">Home team</label>
        <input id="homeTeam" type="text" placeholder="Home" autocomplete="off" enterkeyhint="done" />
      </div>
      <div class="field">
        <label for="awayTeam">Opponent</label>
        <input id="awayTeam" type="text" placeholder="Opponent" autocomplete="off" enterkeyhint="done" />
      </div>
      <div class="field field--short">
        <label for="maxOvers">Overs each</label>
        <input id="maxOvers" type="number" min="1" max="99" inputmode="numeric" value="5" />
      </div>
      <p class="setup-note">A wide or no ball adds 2 runs and doesn't count as a ball.</p>
      <div class="setup-actions">
        <button class="btn-solid" data-action="close-setup">Done</button>
        <button class="btn-quiet btn-reset" data-action="reset-match" id="resetBtn">Reset match</button>
      </div>
    </section>

    <main class="board">
      <section class="scoreboard">
        <p class="scoreline">
          <span id="runs">0</span><span class="slash">/</span><span id="wickets">0</span>
        </p>
        <p class="scoremeta">
          <span id="oversText">0.0 overs</span>
          <span class="rule" aria-hidden="true"></span>
          <span id="rateText">0.00 an over</span>
        </p>
        <div class="over-strip" id="overStrip" aria-label="This over"></div>
      </section>

      <p class="match-status" id="matchStatus" hidden></p>

      <section class="pad" id="pad">
        <div class="pad-runs">
          <button class="run-btn" data-action="run" data-value="0">0</button>
          <button class="run-btn" data-action="run" data-value="1">1</button>
          <button class="run-btn" data-action="run" data-value="2">2</button>
          <button class="run-btn" data-action="run" data-value="3">3</button>
          <button class="run-btn" data-action="run" data-value="4">4</button>
          <button class="run-btn" data-action="run" data-value="6">6</button>
        </div>
        <div class="pad-events">
          <button class="event-btn event-btn--wicket" data-action="wicket">Wicket</button>
          <button class="event-btn event-btn--wicket" data-action="runout">Run out</button>
          <button class="event-btn event-btn--extra" data-action="wide+">Wide<span class="event-hint">+2</span></button>
          <button class="event-btn event-btn--extra" data-action="noball+">No ball<span class="event-hint">+2</span></button>
        </div>
      </section>

      <div class="tray">
        <button class="btn-quiet" data-action="undo" id="undoBtn">Undo</button>
        <p class="last-ball" id="lastBall">No balls bowled yet</p>
      </div>

      <details class="history">
        <summary>Over by over<span class="caret" aria-hidden="true"></span></summary>
        <ul class="history-list" id="overList"></ul>
      </details>
    </main>
  </div>

  <div class="backdrop" id="backdrop" data-action="extra-cancel" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <h2 class="sheet-title" id="sheetTitle">Wide</h2>
    <p class="sheet-hint" id="sheetHint"></p>
    <div class="sheet-grid">
      <button data-action="extra-run" data-value="0">0</button>
      <button data-action="extra-run" data-value="1">1</button>
      <button data-action="extra-run" data-value="2">2</button>
      <button data-action="extra-run" data-value="3">3</button>
      <button data-action="extra-run" data-value="4">4</button>
      <button data-action="extra-run" data-value="5">5</button>
      <button data-action="extra-run" data-value="6">6</button>
    </div>
    <button class="btn-quiet sheet-cancel" data-action="extra-cancel">Cancel</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
